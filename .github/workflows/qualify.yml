name: Build and qualify native platforms
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qualify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rust: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            rust: aarch64-unknown-linux-gnu
            platform: linux-aarch64
          - runner: windows-2022
            rust: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - runner: windows-2022
            rust: i686-pc-windows-msvc
            platform: windows-x86
          - runner: windows-11-arm
            rust: aarch64-pc-windows-msvc
            platform: windows-aarch64
          - runner: macos-15-intel
            rust: x86_64-apple-darwin
            platform: macos-x86_64
          - runner: macos-15
            rust: aarch64-apple-darwin
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - name: Install Linux runtime and packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxkbcommon-x11-0 libxkbcommon-dev libwayland-dev mesa-vulkan-drivers libgl1-mesa-dri xvfb dbus-x11 xdg-desktop-portal rpm cpio
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.rust }} -- -D warnings
      - run: cargo test --locked --workspace --target ${{ matrix.rust }}
      - run: cargo build --locked --release --bins --target ${{ matrix.rust }}
      - name: Native first-frame and persisted-state smoke (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 scripts/native_smoke.py --binary target/${{ matrix.rust }}/release/craftlauncher
      - name: Native first-frame and persisted-state smoke (Windows/macOS)
        if: runner.os != 'Linux'
        run: python scripts/native_smoke.py --binary target/${{ matrix.rust }}/release/craftlauncher${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Real signed update and rollback qualification (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 scripts/qualify_updates.py --target ${{ matrix.rust }}
      - name: Real signed update and rollback qualification (Windows/macOS)
        if: runner.os != 'Linux'
        run: python scripts/qualify_updates.py --target ${{ matrix.rust }}
      - name: Package Linux and Windows distributions
        if: runner.os != 'macOS'
        run: python scripts/package.py --binaries target/${{ matrix.rust }}/release --output .tmp/packages --version 0.1.0 --target ${{ matrix.platform }} --native-installer
      - name: Verify Linux package installation
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i .tmp/packages/*.deb
          dbus-run-session -- xvfb-run -a python3 scripts/native_smoke.py --binary /opt/craftlauncher/craftlauncher
          sudo dpkg -r craftlauncher
          mkdir -p .tmp/rpm-extract
          cd .tmp/rpm-extract
          rpm2cpio ../packages/*.rpm | cpio -id
          cd ../..
          dbus-run-session -- xvfb-run -a python3 scripts/native_smoke.py --binary .tmp/rpm-extract/opt/craftlauncher/craftlauncher
      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem .tmp/packages/*-setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'CraftLauncher installer smoke'
          $process = Start-Process $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          & "$destination/craftlauncher.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable failed' }
          python scripts/native_smoke.py --binary "$destination/craftlauncher.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed UI failed' }
          $process = Start-Process "$destination/Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstaller failed' }
      - name: Build universal macOS bundle
        if: matrix.platform == 'macos-aarch64'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --locked --release --bins --target x86_64-apple-darwin
          mkdir -p .tmp/universal
          for binary in craftlauncher craftlauncher-bootstrap craftlauncher-updater; do
            lipo -create target/aarch64-apple-darwin/release/$binary target/x86_64-apple-darwin/release/$binary -output .tmp/universal/$binary
            lipo -verify_arch x86_64 arm64 .tmp/universal/$binary
          done
          python3 scripts/package.py --binaries .tmp/universal --output .tmp/packages --version 0.1.0 --target macos-universal --native-installer
          tar -xzf .tmp/packages/craftlauncher-0.1.0-macos-universal.tar.gz -C .tmp/universal
          python3 scripts/native_smoke.py --binary .tmp/universal/CraftLauncher.app/Contents/MacOS/craftlauncher
      - uses: actions/upload-artifact@v7
        if: matrix.platform != 'macos-x86_64'
        with:
          name: craftlauncher-${{ matrix.platform }}
          path: .tmp/packages/*
          if-no-files-found: error
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          prepare: pkg install -y rust pkgconf python311 libX11 libXcursor libXi libXrandr libxkbcommon wayland mesa-dri libglvnd vulkan-loader dbus xorg-vfbserver
          run: |
            cargo build --locked --release --bins
            cargo test --locked --workspace
            mkdir -p .tmp
            Xvfb :99 -screen 0 1280x900x24 > .tmp/xvfb.log 2>&1 &
            xvfb_pid=$!
            trap 'kill "$xvfb_pid"' EXIT
            sleep 2
            dbus-run-session -- env DISPLAY=:99 python3.11 scripts/native_smoke.py --binary target/release/craftlauncher
            dbus-run-session -- env DISPLAY=:99 python3.11 scripts/qualify_updates.py
            python3.11 scripts/package.py --binaries target/release --output .tmp/packages --version 0.1.0 --target freebsd-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: craftlauncher-freebsd-x86_64
          path: .tmp/packages/*
          if-no-files-found: error
